<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiter Urlaubsplaner - Excel Kachel-Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="excel-tabelle-container">
        
        <!-- KOPFZEILE (Alle IDs für die Live-Statistiken garantiert vorhanden) -->
        <div class="excel-header-row">
            <div class="kpi-box font-bold-box">
                <span>Jahr: <span id="kpi-jahr">2026</span></span>
                <button id="btn-export" class="btn-primary">💾 Liste.csv speichern</button>
            </div>
            <div class="kpi-box font-bold-box">
                <span>Monat: <span id="kpi-monat" style="font-weight: normal;">-</span></span>
                <input type="date" id="kpi-startdatum-input" style="font-size: 11px; padding: 2px; border: 1px solid #d1d5db; border-radius: 3px;">
            </div>
            <div class="kpi-box">Nettoarbeitstage: <span id="kpi-netto">0</span></div>
            <div class="kpi-box kpi-stunden-box">Stunden Nettoarbeitstage * 8,24: <span id="kpi-stunden">0h</span></div>
        </div>

        <!-- HAUPTBEREICH -->
        <div class="excel-main-layout">
            
            <!-- LINKE SPALTE: Mitarbeiter & Konten -->
            <div id="mitarbeiter-linke-spalte" class="linke-spalte-bg"></div>

            <!-- MITTLERE SPALTE: Kalenderkacheln -->
            <div class="mitte-layout">
                <div class="wochen-grid weekday-header">
                    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div class="weekend-text">Sa</div><div class="weekend-text">So</div>
                </div>
                <div id="kalender-mitte-raster" class="wochen-grid grid-content"></div>
            </div>

            <!-- RECHTE SPALTE: Quick-Infos -->
            <div id="excel-rechte-spalte" class="rechte-spalte-bg">
                <div class="info-card">
                    <div class="card-title">Nächster Feiertag</div>
                    <div id="rechts-feiertag" class="feiertag-box">-</div>
                </div>
                <div class="info-card flex-grow">
                    <div class="card-title">Anstehender Urlaub</div>
                    <div id="rechts-urlaube-liste"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- POP-UP MODAL FÜR BEARBEITUNG -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-datum-titel">Eintrag bearbeiten</h3>
                <span id="modal-close" class="modal-close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Mitarbeiter:</label>
                    <select id="modal-mitarbeiter-select"></select>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="modal-typ-select">
                        <option value="FE">🌴 Ferien (U)</option>
                        <option value="KR">🤒 Krank (F)</option>
                        <option value="UZ">⏳ Überzeit (UZ)</option>
                        <option value="DELETE">❌ Eintrag löschen</option>
                    </select>
                </div>
                <button id="modal-save-btn" class="btn-success">Übernehmen</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
